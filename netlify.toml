[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://server-alpha-neon.vercel.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"

# Context-specific environment variables
[context.production.environment]
  VITE_API_URL = "https://server-alpha-neon.vercel.app"

[context.deploy-preview.environment]
  VITE_API_URL = "https://server-alpha-neon.vercel.app"